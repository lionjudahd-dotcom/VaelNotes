<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&display=block">
<style>
html,body{margin:0;background:#141A18}
/* 1024 square. The mark sits inside the middle 80% so the maskable version survives round and squircle crops. */
.icon{width:1024px;height:1024px;position:relative;background:radial-gradient(circle at 50% 42%,#27332F 0,#141A18 68%);overflow:hidden}
.v{position:absolute;inset:0;display:grid;place-items:center;font-family:"IM Fell English SC",Georgia,serif;font-size:640px;line-height:1;color:#E6E2D3;padding-bottom:40px}
/* the crack in the Vael: a thin violet seam through the letter */
.rift{position:absolute;left:50%;top:150px;width:10px;height:724px;transform:translateX(-50%) skewX(-7deg);background:linear-gradient(#B49AD800,#B49AD8 30%,#F2ECFF 50%,#B49AD8 70%,#B49AD800);border-radius:5px;box-shadow:0 0 46px 10px #6B4E8CAA}
</style></head>
<body><div class="icon"><div class="v">V</div><div class="rift"></div></div></body></html>
